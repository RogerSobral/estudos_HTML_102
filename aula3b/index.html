<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Cards</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Pliant:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

*{
    margin: 0;
    padding: 0;
    font-family: "Roboto", sans-serif;
}

main{
   width: 100vw; 

}


.card{
padding: 7px;
 display: inline-block;
 width: 250px;
 box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
}

.card span{
    position: absolute;
    padding: 10px;
    color: grey;
}

.card img{
    width: 100%;
}

.card h3{
    margin: 10px ;
    text-align: center;
    font-size: 1.5em;
    color: rgb(59, 59, 59);


}

.card p{
    color: #777777;
    text-align: center;
    margin-bottom: 10px;
}

.card button{
    width:100% ;
    height: 40px;
    border: none;
    color: #313131;
    font-weight: 800;
    background-color: #F7C501;
}


</style>

</head>
<body>

    <main>

        <div class="card">
            <span class="material-symbols-outlined">
                sports_bar
            </span>
            <img src="assets/brahma.jpg" alt="Garrafa da brahma gelada.">
            <h3>R$ 5,50</h3>
            <p>Brahma 300ml | apenas o <br> Líquido - unidade</p>
            <button>Adicionar</button>

        </div>

        <div class="card"><img src="" alt=""></div>
        <div class="card"><img src="" alt=""></div>

    </main>
    
</body>
</html>
