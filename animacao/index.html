<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #um{
            width: 300px;
            height: 300px;
            background-color: aqua;
            transition: width 2s, background-color 2s,transform 2s;
        }

        #um:hover{
           width: 450px;
           background-color: rgb(13, 92, 92);
           transform: rotate(45deg);
        }

        #dois{
            width: 300px;
            height: 300px;
            background-color: rgb(238, 0, 255);
            transition: border-radius 1s, transform 1s;
            transition-timing-function: ease-in-out;
        }

        #dois:hover{

            border-radius: 50%;
            transform: translate(100px, 300px);
            
        }

        #card{
            display: flex;
            flex-direction: column;
            width: 300px;
            text-align: center;
            border:1px solid #000;
            transition: transform 1s ease;
        }

        #card:active{
            transform: scale(1.5,1.5);
            
        }
        /* #rotate{
            display: inline-block;
            width: 300px;
            text-align: center;
            transform-origin: center;
            transition: transform 1s;
        }

     
        #rotate:hover{

        transform: rotateY(180deg);
        }

        img{
            width: 300px;
        } */


        #rotate{
    width: 300px;
    height: 400px;
    perspective: 1000px;
}
    .card-interno{
        position: relative;
        width: 100%;
        height: 100%;

        transition: transform 1s;
        transform-style: preserve-3d;
    }
    #rotate:hover .card-interno{
    transform: rotateY(180deg);
}

.frente,
.verso{
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid #000;
    backface-visibility: hidden;
}

.frente img,
.verso img{
    width: 100%;
}

.verso{
    transform: rotateY(180deg);
}

    </style>
</head>
<body>

    <div id="um">


    </div>

    <div id="dois">


    </div>


    <div id="card">
        <img src="Darth_Maul_profile.png" alt="">
        <h1>Foto x</h1>

    </div>

    <!-- <div id="rotate">
        <img src="Darth_Maul_profile.png" alt="">
        <h1>Foto x</h1>

    </div> -->





    <div id="rotate">
        <div class="card-interno">
    
            <div class="frente">
                <img src="Darth_Maul_profile.png" alt="">
                <h1>Darth Maul</h1>
            </div>
    
            <div class="verso">
                <img src="como-tirar-mancha-de-espinha-do-rosto(test).jpg" alt="">
                <h1>Outra Foto</h1>
            </div>
    
        </div>
    </div>
    
</body>
</html>
